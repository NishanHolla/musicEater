<!-- templates/index.html -->

<!DOCTYPE html>
<html>

<head>

    <title>musicEater</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-zinc-950 text-white min-h-screen overflow-x-hidden">

    <!-- NAVBAR -->

    <nav class="border-b border-zinc-800 bg-zinc-900 sticky top-0 z-50 backdrop-blur">

        <div class="max-w-7xl mx-auto px-3 md:px-5 py-4 flex flex-col gap-3">

            <!-- TOP ROW -->
            <div class="flex items-center justify-between gap-3">

                <h1 class="text-2xl md:text-3xl font-bold shrink-0">
                    musicEater
                </h1>

            </div>

            <!-- SEARCH -->
            <input
                type="text"
                id="searchInput"
                placeholder="Search songs..."
                class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 outline-none text-sm md:text-base"
            >

            <!-- DOWNLOAD -->
            <form
                id="downloadForm"
                class="flex flex-col md:flex-row gap-3"
            >

                <input
                    type="text"
                    id="urlInput"
                    placeholder="Paste YouTube URL"
                    required
                    class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 outline-none text-sm md:text-base"
                >

                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 px-5 py-3 rounded-xl font-semibold w-full md:w-auto"
                >
                    Import to Library
                </button>

            </form>

        </div>

    </nav>

    <!-- DOWNLOAD LOADER -->

    <div
        id="loader"
        class="hidden fixed top-4 right-4 left-4 md:left-auto md:w-[320px] bg-zinc-900 border border-zinc-700 px-5 py-4 rounded-2xl shadow-2xl z-50"
    >

        <div class="flex items-center gap-4">

            <div class="animate-spin rounded-full h-6 w-6 border-4 border-zinc-600 border-t-white shrink-0"></div>

            <div class="min-w-0">

                <h2 class="font-semibold truncate">
                    Downloading...
                </h2>

                <p class="text-sm text-zinc-400">
                    Your songs will appear automatically
                </p>

            </div>

        </div>

    </div>

    <!-- SONGS -->

    <div
        id="songs"
        class="p-3 md:p-5 space-y-3 pb-52 md:pb-44 max-w-7xl mx-auto"
    >

    </div>

    <!-- QUEUE SIDEBAR -->

    <div id="queuePanel"
        class="fixed right-0 top-0 h-full w-80 bg-zinc-900 border-l border-zinc-800 p-4 hidden flex flex-col z-50">

        <div class="flex justify-between items-center mb-4">

            <h2 class="font-bold text-lg">Queue</h2>

            <button onclick="toggleQueue()"
                    class="text-sm text-zinc-400">
                Close
            </button>

        </div>

        <div class="flex gap-2 mb-3">

            <button onclick="toggleShuffle()"
                    class="bg-zinc-800 px-3 py-1 rounded">
                Shuffle
            </button>

            <button onclick="toggleRepeat()"
                    class="bg-zinc-800 px-3 py-1 rounded">
                Repeat
            </button>

        </div>

        <div id="queueList"
            class="flex-1 overflow-auto space-y-2">
        </div>

    </div>

    <!-- QUEUE TOGGLE BUTTON -->

    <button onclick="toggleQueue()"
            class="fixed right-4 bottom-24 bg-blue-600 px-4 py-2 rounded-xl z-50">
        Queue
    </button>

    <!-- PLAYER -->

    <div class="fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-800 p-3 md:p-4">

        <div class="max-w-7xl mx-auto">

            <!-- SONG INFO -->

            <div class="flex items-center gap-3 md:gap-4">

                <img
                    id="playerThumbnail"
                    src=""
                    class="w-14 h-14 md:w-16 md:h-16 rounded-xl object-cover bg-zinc-800 shrink-0"
                >

                <div class="flex-1 min-w-0">

                    <h2
                        id="playerTitle"
                        class="font-semibold text-sm md:text-lg truncate"
                    >
                        No song selected
                    </h2>

                    <p
                        id="playerUploader"
                        class="text-zinc-400 text-xs md:text-base truncate"
                    >
                        -
                    </p>

                </div>

            </div>

            <!-- AUDIO -->

            <audio
                id="audioPlayer"
                controls
                class="w-full mt-3 md:mt-4 h-10"
            ></audio>

        </div>

    </div>

<script>

const songsContainer = document.getElementById("songs")

const player = document.getElementById("audioPlayer")

const playerTitle = document.getElementById("playerTitle")

const playerUploader = document.getElementById("playerUploader")

const playerThumbnail = document.getElementById("playerThumbnail")

const loader = document.getElementById("loader")

const downloadForm = document.getElementById("downloadForm")

const urlInput = document.getElementById("urlInput")

const searchInput = document.getElementById("searchInput")

let allSongs = []
let queue = []
let currentIndex = -1
let shuffle = false
let repeat = false

// ======================================
// LOAD SONGS
// ======================================

async function loadSongs() {

    const response = await fetch("/api/songs")

    const songs = await response.json()

    allSongs = songs

    renderSongs(songs)
}

// ======================================
// RENDER SONGS
// ======================================

function renderSongs(songs) {

    songsContainer.innerHTML = ""

    songs.forEach(song => {

        const div = document.createElement("div")

        div.className =
            "bg-zinc-900 border border-zinc-800 rounded-2xl p-3 md:p-4 flex items-center gap-3 md:gap-4 hover:bg-zinc-800 cursor-pointer transition"

        div.innerHTML = `
            <img
                src="${song.thumbnail_url}"
                class="w-16 h-16 md:w-20 md:h-20 rounded-xl object-cover shrink-0"
            >

            <div class="flex-1 min-w-0">
                <h2 class="font-semibold text-sm md:text-lg truncate">
                    ${song.title}
                </h2>

                <p class="text-zinc-400 text-xs md:text-base truncate">
                    ${song.uploader || "Unknown"}
                </p>
            </div>

            <button onclick="playNext(${JSON.stringify(song).replace(/"/g, '&quot;')})"
                    class="bg-yellow-600 px-3 py-1 rounded">
                Play Next
            </button>

            <button onclick="addToQueue(${JSON.stringify(song).replace(/"/g, '&quot;')})"
                    class="bg-green-600 px-3 py-1 rounded">
                Add
            </button>
        `

        // div.onclick = () => {

        //     queue = allSongs
        //     currentIndex = queue.findIndex(s => s.id === song.id)

        //     playCurrent()
        // }

        div.onclick = () => {

            queue = [...allSongs]
            currentIndex = queue.findIndex(s => s.id === song.id)

            playCurrent()
            renderQueue()
        }

        songsContainer.appendChild(div)
    })
}

// ======================================
// SEARCH
// ======================================

searchInput.addEventListener("input", () => {

    const value = searchInput.value.toLowerCase()

    const filtered = allSongs.filter(song => {

        return (
            song.title.toLowerCase().includes(value) ||
            (song.uploader || "").toLowerCase().includes(value)
        )
    })

    renderSongs(filtered)
})

// ======================================
// DOWNLOAD
// ======================================

downloadForm.addEventListener("submit", async (e) => {

    e.preventDefault()

    const url = urlInput.value

    if (!url)
        return

    loader.classList.remove("hidden")

    const formData = new FormData()

    formData.append("url", url)

    await fetch("/download", {
        method: "POST",
        body: formData
    })

    urlInput.value = ""

    setTimeout(() => {

        loader.classList.add("hidden")

    }, 10000)
})

function playCurrent() {

    const song = queue[currentIndex]

    if (!song) return

    player.src = `/api/stream/${song.id}`
    player.play()

    playerTitle.innerText = song.title
    playerUploader.innerText = song.uploader || "-"
    playerThumbnail.src = song.thumbnail_url

    renderQueue()
}

function renderQueue() {

    const list = document.getElementById("queueList")

    list.innerHTML = ""

    queue.forEach((song, index) => {

        const div = document.createElement("div")

        div.className =
            "p-2 bg-zinc-800 rounded flex items-center justify-between cursor-move"

        div.draggable = true

        div.innerHTML = `
            <div class="truncate">
                ${song.title}
            </div>

            <div class="flex gap-2">

                <button onclick="playNow(${index})">▶</button>
                <button onclick="removeFromQueue(${index})">✕</button>

            </div>
        `

        // drag events
        div.ondragstart = (e) => {
            e.dataTransfer.setData("index", index)
        }

        div.ondragover = (e) => e.preventDefault()

        div.ondrop = (e) => {

            const from = e.dataTransfer.getData("index")
            const to = index

            const moved = queue.splice(from, 1)[0]
            queue.splice(to, 0, moved)

            renderQueue()
        }

        list.appendChild(div)
    })
}

function playNow(index) {
    currentIndex = index
    playCurrent()
}

function removeFromQueue(index) {

    queue.splice(index, 1)

    if (currentIndex >= queue.length)
        currentIndex = queue.length - 1

    renderQueue()
}

function playNext(song) {

    if (currentIndex === -1) {
        queue = [song]
        currentIndex = 0
    } else {
        queue.splice(currentIndex + 1, 0, song)
    }

    renderQueue()
}

function addToQueue(song) {
    queue.push(song)
    renderQueue()
}

function toggleShuffle() {
    shuffle = !shuffle
}

function toggleRepeat() {
    repeat = !repeat
}

function toggleQueue() {

    document.getElementById("queuePanel")
        .classList.toggle("hidden")
}

player.addEventListener("ended", () => {

    if (repeat) {
        playCurrent()
        return
    }

    if (shuffle) {
        currentIndex = Math.floor(Math.random() * queue.length)
        playCurrent()
        return
    }

    if (currentIndex < queue.length - 1) {
        currentIndex++
        playCurrent()
    }
})

// ======================================
// AUTO REFRESH
// ======================================

setInterval(loadSongs, 5000)

// ======================================
// INITIAL LOAD
// ======================================

loadSongs()

</script>

</body>
</html>
