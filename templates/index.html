<!DOCTYPE html>
<html>
<head>
    <title>Music Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-white min-h-screen flex items-center justify-center">

<div class="bg-zinc-800 p-8 rounded-2xl w-full max-w-xl">

    <h1 class="text-3xl font-bold mb-6 text-center">
        Music Downloader
    </h1>

    <form action="/download" method="POST" class="space-y-4">

        <input
            type="text"
            name="url"
            placeholder="Paste YouTube video or playlist URL"
            required
            class="w-full p-4 rounded-xl bg-zinc-700 border border-zinc-600"
        >

        <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-semibold"
        >
            Download
        </button>

    </form>

</div>

</body>
</html>
