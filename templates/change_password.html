<!DOCTYPE html>
<html>
<head>
    <title>Change password | musicEater</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-3xl p-8 shadow-2xl">
        <h1 class="text-3xl font-bold mb-2 text-center">Change password</h1>
        <p class="mb-6 text-sm text-zinc-400 text-center">You must set a new password before continuing.</p>

        {% if error %}
        <div class="mb-4 rounded-xl bg-red-600/20 border border-red-500 px-4 py-3 text-red-100">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('auth.change_password') }}" method="post" class="space-y-4">
            <div>
                <label for="current_password" class="block text-sm text-zinc-400 mb-2">Current password</label>
                <input type="password" name="current_password" id="current_password" required class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-white outline-none" />
            </div>

            <div>
                <label for="new_password" class="block text-sm text-zinc-400 mb-2">New password</label>
                <input type="password" name="new_password" id="new_password" required minlength="8" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-white outline-none" />
            </div>

            <div>
                <label for="confirm_password" class="block text-sm text-zinc-400 mb-2">Confirm new password</label>
                <input type="password" name="confirm_password" id="confirm_password" required minlength="8" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-white outline-none" />
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 rounded-2xl px-4 py-3 font-semibold">Update password</button>
        </form>
    </div>
</body>
</html>
